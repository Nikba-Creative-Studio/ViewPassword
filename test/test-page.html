<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViewPassword — Test Page</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 460px;
        margin: 40px auto;
        padding: 0 20px;
        color: #1c1c1e;
      }
      h1 { font-size: 20px; }
      label { display: block; margin: 16px 0 4px; font-weight: 600; }
      input {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }
      button.add {
        margin-top: 20px;
        padding: 8px 14px;
        border: 0;
        border-radius: 8px;
        background: #0a84ff;
        color: #fff;
        cursor: pointer;
      }
      .hint { color: #6b6b70; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>ViewPassword — Test Page</h1>
    <p class="hint">
      Hover or focus a password field below. The ViewPassword toolbar should
      appear at the right edge of the field.
    </p>

    <form autocomplete="on">
      <label for="user">Username</label>
      <input id="user" type="text" value="demo.user" autocomplete="username" />

      <label for="pw1">Password</label>
      <input id="pw1" type="password" value="S3cr3t-Pa55w0rd!" autocomplete="current-password" />

      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" value="S3cr3t-Pa55w0rd!" autocomplete="new-password" />
    </form>

    <button class="add" id="add">Add a dynamic password field</button>

    <script>
      // Verifies dynamic-field handling (fields added after page load).
      let n = 0;
      document.getElementById("add").addEventListener("click", () => {
        n += 1;
        const label = document.createElement("label");
        label.textContent = "Dynamic field #" + n;
        const input = document.createElement("input");
        input.type = "password";
        input.value = "dynamic-value-" + n;
        document.body.appendChild(label);
        document.body.appendChild(input);
      });
    </script>
  </body>
</html>
